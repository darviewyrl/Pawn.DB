name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  worker-tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check worker pool with TSan
        run: |
          g++ -std=c++20 -pthread -fsanitize=thread -fPIE -pie -g -Iinclude tests/worker_pool_check.cpp -o worker_pool_tsan
          ./worker_pool_tsan
          g++ -std=c++20 -pthread -fsanitize=thread -fPIE -pie -g -Iinclude tests/dispatch_check.cpp -o dispatch_tsan
          ./dispatch_tsan
          g++ -std=c++20 -pthread -fsanitize=thread -fPIE -pie -g -Iinclude -Ithird_party/json/include tests/connection_manager_check.cpp -o connection_manager_tsan
          ./connection_manager_tsan
          g++ -std=c++20 -pthread -fsanitize=thread -fPIE -pie -g -Iinclude -Ithird_party/json/include -Ithird_party/omp-pawn-compiler/source -Ithird_party/omp-pawn-compiler/source/linux -DHAVE_STDINT_H=1 -DPAWN_CELL_SIZE=32 -DPAWNDB_OMP=1 tests/async_query_check.cpp -o async_query_tsan
          ./async_query_tsan
          g++ -std=c++20 -pthread -fsanitize=thread -fPIE -pie -g -Iinclude -Ithird_party/json/include tests/telemetry_check.cpp -o telemetry_tsan
          ./telemetry_tsan
          g++ -std=c++20 -pthread -fsanitize=thread -fPIE -pie -g -Iinclude -Ithird_party/json/include tests/shutdown_check.cpp -o shutdown_tsan
          ./shutdown_tsan
      - name: Check Argon2id native pipeline with TSan
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
          bash ci/check-crypto.sh thread
  worker-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check async pipeline, telemetry and shutdown with ASan
        run: |
          g++ -std=c++20 -pthread -fsanitize=address -fno-omit-frame-pointer -g -Iinclude tests/worker_pool_check.cpp -o worker_pool_asan
          ./worker_pool_asan
          g++ -std=c++20 -pthread -fsanitize=address -fno-omit-frame-pointer -g -Iinclude tests/dispatch_check.cpp -o dispatch_asan
          ./dispatch_asan
          g++ -std=c++20 -pthread -fsanitize=address -fno-omit-frame-pointer -g -Iinclude -Ithird_party/json/include tests/connection_manager_check.cpp -o connection_manager_asan
          ./connection_manager_asan
          g++ -std=c++20 -pthread -fsanitize=address -fno-omit-frame-pointer -g -Iinclude -Ithird_party/json/include -Ithird_party/omp-pawn-compiler/source -Ithird_party/omp-pawn-compiler/source/linux -DHAVE_STDINT_H=1 -DPAWN_CELL_SIZE=32 -DPAWNDB_OMP=1 tests/async_query_check.cpp -o async_query_asan
          ./async_query_asan
          g++ -std=c++20 -pthread -fsanitize=address -fno-omit-frame-pointer -g -Iinclude -Ithird_party/json/include tests/telemetry_check.cpp -o telemetry_asan
          ./telemetry_asan
          g++ -std=c++20 -pthread -fsanitize=address -fno-omit-frame-pointer -g -Iinclude -Ithird_party/json/include tests/shutdown_check.cpp -o shutdown_asan
          ./shutdown_asan
      - name: Check Argon2id native pipeline with ASan and leak detection
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
          ASAN_OPTIONS=detect_leaks=1 bash ci/check-crypto.sh address
  build:
    name: ${{ matrix.target }} ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, arch: x86, target: omp }
          - { os: windows-2022, arch: x64, target: omp }
          - { os: ubuntu-24.04, arch: x86, target: omp }
          - { os: ubuntu-24.04, arch: x64, target: omp }
          - { os: windows-2022, arch: x86, target: samp }
          - { os: ubuntu-24.04, arch: x86, target: samp }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          if [ '${{ matrix.arch }}' = x86 ]; then sudo dpkg --add-architecture i386; fi
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build meson flex bison perl pkg-config ${{ matrix.arch == 'x86' && 'gcc-multilib g++-multilib' || '' }}
      - name: Build and verify Linux
        if: runner.os == 'Linux'
        run: bash ci/build-linux.sh '${{ matrix.arch }}' '${{ matrix.target }}'
      - name: Verify database sessions
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x64' && matrix.target == 'omp'
        run: |
          docker run -d --name pawndb-maria -p 127.0.0.1:33306:3306 -e MARIADB_ROOT_PASSWORD=pdbroot -e MARIADB_DATABASE=pdbtest -e MARIADB_USER=pdbuser -e MARIADB_PASSWORD=pdbpass mariadb:11.4
          docker run -d --name pawndb-mysql -p 127.0.0.1:33307:3306 -e MYSQL_ROOT_PASSWORD=pdbroot -e MYSQL_DATABASE=pdbtest -e MYSQL_USER=pdbuser -e MYSQL_PASSWORD=pdbpass mysql:8.4
          for n in $(seq 1 60); do
            if docker exec pawndb-maria mariadb-admin ping -h 127.0.0.1 -uroot -ppdbroot --silent && docker exec pawndb-mysql mysqladmin ping -h 127.0.0.1 -uroot -ppdbroot --silent; then break; fi
            sleep 2
          done
          test "$(docker exec pawndb-maria mariadb -uroot -ppdbroot -Nse "SELECT plugin FROM mysql.user WHERE user='pdbuser'")" = mysql_native_password
          test "$(docker exec pawndb-mysql mysql -uroot -ppdbroot -Nse "SELECT plugin FROM mysql.user WHERE user='pdbuser'")" = caching_sha2_password
          ./build/ci/pawndb_mariadb_session_check 33306 pdbuser pdbpass pdbtest 127.0.0.1
          ./build/ci/pawndb_mariadb_session_check 33307 pdbuser pdbpass pdbtest 127.0.0.1
          tls_dir=build/ci/tls
          mkdir -p "$tls_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$tls_dir/ca.key" -out "$tls_dir/ca.crt" -days 2 -subj '/CN=PawnDB CI CA' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl req -newkey rsa:2048 -nodes -keyout "$tls_dir/server.key" -out "$tls_dir/server.csr" -subj '/CN=127.0.0.1'
          printf 'subjectAltName=IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > "$tls_dir/server.ext"
          openssl x509 -req -in "$tls_dir/server.csr" -CA "$tls_dir/ca.crt" -CAkey "$tls_dir/ca.key" -CAcreateserial -out "$tls_dir/server.crt" -days 1 -sha256 -extfile "$tls_dir/server.ext"
          openssl req -newkey rsa:2048 -nodes -keyout "$tls_dir/client.key" -out "$tls_dir/client.csr" -subj '/CN=pdbuser'
          printf 'extendedKeyUsage=clientAuth\n' > "$tls_dir/client.ext"
          openssl x509 -req -in "$tls_dir/client.csr" -CA "$tls_dir/ca.crt" -CAkey "$tls_dir/ca.key" -CAcreateserial -out "$tls_dir/client.crt" -days 1 -sha256 -extfile "$tls_dir/client.ext"
          printf 'local all all trust\nhostssl pdbtest pdbuser 0.0.0.0/0 cert\nhostssl pdbtest all 0.0.0.0/0 scram-sha-256\nhostnossl pdbtest all 0.0.0.0/0 scram-sha-256\n' > "$tls_dir/pg_hba.conf"
          chmod 600 "$tls_dir/server.key" "$tls_dir/client.key"
          sudo chown 999:999 "$tls_dir/server.key"
          docker run -d --name pawndb-postgres -p 127.0.0.1:35432:5432 -e POSTGRES_PASSWORD=pdbpass -e POSTGRES_USER=pdbuser -e POSTGRES_DB=pdbtest -v "$PWD/$tls_dir:/tls:ro" postgres:18 -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key -c ssl_ca_file=/tls/ca.crt -c ssl_min_protocol_version=TLSv1.2 -c ssl_max_protocol_version=TLSv1.3 -c hba_file=/tls/pg_hba.conf
          for n in $(seq 1 60); do
            if docker exec pawndb-postgres pg_isready -U pdbuser -d pdbtest; then break; fi
            sleep 2
          done
          ./build/ci/pawndb_postgres_session_check 35432 pdbuser pdbpass pdbtest 127.0.0.1
          docker exec pawndb-postgres psql -U pdbuser -d pdbtest -c "CREATE ROLE pdbssl LOGIN PASSWORD 'pdbpass'"
          ./build/ci/pawndb_postgres_session_check 35432 pdbssl pdbpass pdbtest 127.0.0.1 "$PWD/$tls_dir/ca.crt" "" "" 1
          ./build/ci/pawndb_postgres_session_check 35432 pdbuser pdbpass pdbtest 127.0.0.1 "$PWD/$tls_dir/ca.crt" "$PWD/$tls_dir/client.crt" "$PWD/$tls_dir/client.key" 1
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl winflexbison3 ninja nasm pkgconfiglite -y --no-progress
          python -m pip install meson==1.12.1
      - name: Build and verify Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/build-windows.ps1 '${{ matrix.arch }}' '${{ matrix.target }}'
      - name: Verify async pipeline, telemetry and shutdown with ASan
        if: matrix.os == 'windows-2022' && matrix.arch == 'x64' && matrix.target == 'omp'
        shell: pwsh
        run: |
          $common = @('/nologo', '/std:c++20', '/EHsc', '/fsanitize=address', '/MD', '/Iinclude')
          & cl @common tests/worker_pool_check.cpp /Fe:worker_pool_asan.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\worker_pool_asan.exe
          & cl @common tests/dispatch_check.cpp /Fe:dispatch_asan.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dispatch_asan.exe
          & cl @common /Ithird_party/json/include tests/connection_manager_check.cpp /Fe:connection_manager_asan.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\connection_manager_asan.exe
          & cl @common /Ithird_party/json/include tests/telemetry_check.cpp /Fe:telemetry_asan.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\telemetry_asan.exe
          & cl @common /Ithird_party/json/include tests/shutdown_check.cpp /Fe:shutdown_asan.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\shutdown_asan.exe
          & cl @common /Ithird_party/json/include /Ithird_party/omp-pawn-compiler/source /Ithird_party/omp-pawn-compiler/source/linux /DHAVE_STDINT_H=1 /DPAWN_CELL_SIZE=32 /DPAWNDB_OMP=1 tests/async_query_check.cpp /Fe:async_query_asan.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\async_query_asan.exe
